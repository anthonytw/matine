# The Lima VM "matine-demo": a rootless Docker (Ubuntu guest, vz, aarch64) that runs the copyright-safe Jellyfin demo
# server for the store screenshots (scripts/demo-server/README.md). The docker blocks come from Lima's stock `docker`
# template; $HOME is not mounted. Created by `demo-server.sh up`, which
# substitutes __MEDIA__ with the absolute path of build/media.
minimumLimaVersion: 2.0.0
vmType: vz
cpus: 2
memory: 4GiB
disk: 30GiB
mounts:
# Only the generated placeholder media, read-only. Jellyfin's config lives in a Docker volume inside the VM.
- location: "__MEDIA__"
  mountPoint: /media-src
  writable: false
containerd:
  system: false
  user: false
provision:
- mode: system
  script: |
    #!/bin/sh
    sed -i 's/host.lima.internal.*/host.lima.internal host.docker.internal/' /etc/hosts
- mode: system
  script: |
    #!/bin/bash
    set -eux -o pipefail
    command -v docker >/dev/null 2>&1 && exit 0
    export DEBIAN_FRONTEND=noninteractive
    curl -fsSL https://get.docker.com | sh
    systemctl disable --now docker.service docker.socket containerd.service containerd.socket || true
    systemctl mask docker.service docker.socket containerd.service containerd.socket || true
    apt-get install -y uidmap dbus-user-session
- mode: user
  script: |
    #!/bin/bash
    set -eux -o pipefail
    systemctl --user start dbus
    dockerd-rootless-setuptool.sh install
    docker context use rootless
    loginctl enable-linger "$USER" || true
probes:
- script: |
    #!/bin/bash
    set -eux -o pipefail
    if ! timeout 30s bash -c "until command -v docker >/dev/null 2>&1; do sleep 3; done"; then
      echo >&2 "docker is not installed yet"
      exit 1
    fi
    if ! timeout 30s bash -c "until pgrep rootlesskit; do sleep 3; done"; then
      echo >&2 "rootlesskit (used by rootless docker) is not running"
      exit 1
    fi
  hint: See "/var/log/cloud-init-output.log" in the guest
portForwards:
- guestSocket: "/run/user/{{.UID}}/docker.sock"
  hostSocket: "{{.Dir}}/sock/docker.sock"
# Caddy's HTTPS port in the guest -> the Mac's loopback only.
- guestPort: 8920
  hostIP: 127.0.0.1
  hostPort: 8920
param:
  internal_netplanOptional: "true"
images:
- location: "https://cloud-images.ubuntu.com/releases/resolute/release-20261016/ubuntu-26.04-server-cloudimg-arm64.img"
  arch: "aarch64"
  digest: "sha256:8eb876c2ccc4b6ff89e4a65d511815923b285e04503ba465809bf587f763da24"
  variant: "server"
